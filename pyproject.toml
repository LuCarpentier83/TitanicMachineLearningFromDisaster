[project]
name = "titanic"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "ipykernel>=7.4.0",
    "ipywidgets>=8.1.9",
    "joblib>=1.6.0",
    "jupyterlab>=4.6.6",
    "kaggle>=2.2.5",
    "matplotlib>=3.11.2",
    "numpy>=2.5.5",
    "optuna>=5.1.0",
    "pandas>=3.1.1",
    "scikit-learn>=1.9.1",
    "scikit-optimize>=0.10.2",
    "scipy>=1.18.1",
    "seaborn>=0.13.2",
    "tqdm>=4.70.1",
    "xgboost>=3.4.1",
]

# Rend le dossier src/titanic importable depuis les notebooks (« from titanic.features import ... »),
# installé en mode éditable par « uv sync » : une modif de features.py est prise en compte au redémarrage du kernel.
[build-system]
requires = ["uv_build>=0.13.5,<0.14"]
build-backend = "uv_build"
